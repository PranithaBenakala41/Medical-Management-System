<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctors | Medical Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .container {
            color: #1e293b;
        }

        h1 {
            color: #0f172a !important;
            visibility: visible !important;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #0f766e;
            color: #ffffff !important;
        }

        .dashboard-btn {
            background: #e2e8f0;
            color: #1e293b !important;
        }

        .edit-btn {
            color: #0369a1 !important;
            margin-right: 8px;
            font-weight: bold;
        }

        .delete-btn {
            color: #dc2626;
            background: #ffffff;
            font-weight: bold;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff !important;
            color: #1e293b !important;
        }

        table th {
            background: #0f766e !important;
            color: #ffffff !important;
            padding: 12px;
            border: 1px solid #cbd5e1;
            text-align: left;
            white-space: nowrap;
            visibility: visible !important;
        }

        table td {
            background: #ffffff;
            color: #1e293b !important;
            padding: 12px;
            border: 1px solid #cbd5e1;
            text-align: left;
        }

        .message {
            margin: 12px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Manage Doctors</h1>

    <p class="message" th:if="${successMessage}"
       th:text="${successMessage}" style="color: green;"></p>

    <p class="message" th:if="${errorMessage}"
       th:text="${errorMessage}" style="color: red;"></p>

    <div class="actions">
        <a th:href="@{/admin/dashboard}"
           class="btn dashboard-btn"
           sec:authorize="hasRole('ADMIN')">
            ← Admin Dashboard
        </a>

        <a th:href="@{/patients/dashboard}"
           class="btn dashboard-btn"
           sec:authorize="hasRole('PATIENT')">
            ← Patient Dashboard
        </a>

        <a th:href="@{/doctors/new}"
           class="btn add-btn"
           sec:authorize="hasRole('ADMIN')">
            + Add Doctor
        </a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialization</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Available Days</th>
                <th sec:authorize="hasRole('ADMIN')">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="doctor : ${doctors}">
                <td th:text="${doctor.id}"></td>
                <td th:text="${doctor.name}"></td>
                <td th:text="${doctor.specialization}"></td>
                <td th:text="${doctor.phone}"></td>
                <td th:text="${doctor.email}"></td>
                <td th:text="${doctor.availableDays}"></td>

                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}"
                       class="edit-btn">Edit</a>

                    <form th:action="@{/doctors/delete/{id}(id=${doctor.id})}"
                          method="post"
                          style="display:inline"
                          onsubmit="return confirm('Delete this doctor?');">
                        <button type="submit" class="delete-btn">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(doctors)}">
                <td colspan="7">No doctors registered yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
