<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Medical Bills | MediCare</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
    }

    header {
        background: #0f766e;
        color: white;
        padding: 22px 7%;
    }

    header h1 {
        margin: 0;
    }

    header p {
        margin-bottom: 0;
    }

    main {
        max-width: 1100px;
        margin: 35px auto;
        padding: 0 20px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 22px;
    }

    .back-btn {
        background: #0f766e;
        color: white;
        text-decoration: none;
        padding: 11px 18px;
        border-radius: 7px;
    }

    .card {
        background: white;
        padding: 22px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
    }

    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
    }

    th {
        background: #f8fafc;
        color: #475569;
    }

    .status {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        background: #dcfce7;
        color: #166534;
        font-size: 13px;
    }

    .empty {
        text-align: center;
        padding: 35px;
        color: #64748b;
    }

    footer {
        text-align: center;
        padding: 25px;
        color: #64748b;
    }
</style>

</head><body><header>
    <h1>MediCare</h1>
    <p>My Medical Bills</p>
</header><main><div class="top-bar">
    <div>
        <h2>My Bills</h2>
        <p>View your medical billing records.</p>
    </div>

    <a th:href="@{/patients/dashboard}" class="back-btn">
        Back to Dashboard
    </a>
</div>

<div class="card">

    <table th:if="${not #lists.isEmpty(bills)}">
        <thead>
            <tr>
                <th>Bill ID</th>
                <th>Description</th>
                <th>Bill Date</th>
                <th>Amount</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="bill : ${bills}">
                <td th:text="${bill.id}"></td>
                <td th:text="${bill.description}"></td>
                <td th:text="${bill.billDate != null ? bill.billDate : 'Not available'}"></td>
                <td th:text="${bill.amount != null ? '₹' + bill.amount : '₹0.00'}"></td>
                <td>
                    <span class="status" th:text="${bill.status != null ? bill.status : 'Pending'}"></span>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(bills)}">
        <h3>No bills available</h3>
        <p>Your medical bills will appear here when they are added to the system.</p>
    </div>

</div>

</main><footer>
    MediCare Medical Management System
</footer></body>
</html>
