<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Form | Medical Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body><div class="container">
    <h1 th:text="${patient.id == null ? 'Add Patient' : 'Edit Patient'}">
        Add Patient
    </h1><form th:action="@{/patients/save}" th:object="${patient}" method="post">

    <label for="name">Full Name</label>
    <input type="text" id="name" th:field="*{name}"
           placeholder="Enter patient name" required>

    <label for="age">Age</label>
    <input type="number" id="age" th:field="*{age}"
           min="0" max="120" required>

    <label for="gender">Gender</label>
    <select id="gender" th:field="*{gender}" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" th:field="*{phone}"
           placeholder="Enter phone number" required>

    <label for="email">Email</label>
    <input type="email" id="email" th:field="*{email}"
           placeholder="Enter email address">

    <label for="address">Address</label>
    <textarea id="address" th:field="*{address}"
              placeholder="Enter address" rows="3"></textarea>

    <button type="submit" class="btn">Save Patient</button>
    <a th:href="@{/patients}" class="btn">Cancel</a>
</form>

</div><script th:src="@{/js/app.js}"></script></body>
</html>
