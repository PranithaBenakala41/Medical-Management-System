<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Medical Bill | MediCare</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
    }

    header {
        background: #0f766e;
        color: white;
        padding: 22px 7%;
    }

    main {
        max-width: 700px;
        margin: 35px auto;
        padding: 0 20px;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .field {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 15px;
        font-family: inherit;
    }

    textarea {
        resize: vertical;
        min-height: 90px;
    }

    .message {
        padding: 12px;
        border-radius: 7px;
        margin-bottom: 18px;
    }

    .error {
        background: #fee2e2;
        color: #991b1b;
    }

    .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 25px;
    }

    .btn {
        padding: 12px 18px;
        border: none;
        border-radius: 7px;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
    }

    .save-btn {
        background: #0f766e;
        color: white;
    }

    .back-btn {
        background: #e2e8f0;
        color: #1e293b;
    }

    footer {
        text-align: center;
        padding: 25px;
        color: #64748b;
    }
</style>

</head><body><header>
    <h1>MediCare — Admin</h1>
    <p>Create a patient medical bill</p>
</header><main>
    <div class="card">    <h2>Create New Bill</h2>
    <p>Enter the billing details below.</p>

    <div class="message error"
         th:if="${errorMessage != null}"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/admin/bills/save}"
          th:object="${bill}"
          method="post">

        <div class="field">
            <label for="patient">Select Patient *</label>

            <select id="patient" th:field="*{patient.id}" required>
                <option value="">-- Select a patient --</option>

                <option th:each="patient : ${patients}"
                        th:value="${patient.id}"
                        th:text="${patient.name + ' (ID: ' + patient.id + ')'}">
                </option>
            </select>
        </div>

        <div class="field">
            <label for="description">Bill Description *</label>

            <textarea id="description"
                      th:field="*{description}"
                      maxlength="500"
                      placeholder="Example: Consultation fee"
                      required></textarea>
        </div>

        <div class="field">
            <label for="amount">Amount (₹) *</label>

            <input id="amount"
                   type="number"
                   th:field="*{amount}"
                   min="0.01"
                   step="0.01"
                   placeholder="Enter amount"
                   required>
        </div>

        <div class="field">
            <label for="billDate">Bill Date</label>

            <input id="billDate"
                   type="date"
                   th:field="*{billDate}">
        </div>

        <div class="field">
            <label for="status">Payment Status *</label>

            <select id="status" th:field="*{status}" required>
                <option value="Pending">Pending</option>
                <option value="Paid">Paid</option>
                <option value="Partially Paid">Partially Paid</option>
            </select>
        </div>

        <div class="buttons">
            <button type="submit" class="btn save-btn">
                Save Bill
            </button>

            <a th:href="@{/admin/bills}" class="btn back-btn">
                Cancel
            </a>
        </div>

    </form>

</div>

</main><footer>
    MediCare Medical Management System
</footer></body>
</html>
