<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bills | MediCare Admin</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
    }

    header {
        background: #0f766e;
        color: white;
        padding: 22px 7%;
    }

    main {
        max-width: 1200px;
        margin: 35px auto;
        padding: 0 20px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 25px;
    }

    .btn {
        display: inline-block;
        padding: 11px 16px;
        border-radius: 7px;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
    }

    .primary {
        background: #0f766e;
        color: white;
    }

    .secondary {
        background: #e2e8f0;
        color: #1e293b;
    }

    .danger {
        background: #fee2e2;
        color: #991b1b;
        border: none;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 5px;
    }

    .message {
        padding: 13px;
        margin-bottom: 18px;
        border-radius: 7px;
    }

    .success {
        background: #dcfce7;
        color: #166534;
    }

    .error {
        background: #fee2e2;
        color: #991b1b;
    }

    .card {
        background: white;
        padding: 22px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 750px;
        border-collapse: collapse;
    }

    th, td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
    }

    th {
        background: #f8fafc;
        color: #475569;
    }

    .empty {
        text-align: center;
        padding: 30px;
        color: #64748b;
    }

    .status {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 20px;
        background: #fef3c7;
        color: #92400e;
        font-size: 12px;
    }

    footer {
        text-align: center;
        padding: 25px;
        color: #64748b;
    }
</style>

</head><body><header>
    <h1>MediCare — Admin</h1>
    <p>Patient Billing Management</p>
</header><main><div class="top-bar">
    <div>
        <h2>Manage Patient Bills</h2>
        <p>View and manage medical bills.</p>
    </div>

    <div>
        <a th:href="@{/admin/bills/new}" class="btn primary">
            + Create Bill
        </a>

        <a th:href="@{/admin/dashboard}" class="btn secondary">
            Dashboard
        </a>
    </div>
</div>

<div class="message success"
     th:if="${successMessage != null}"
     th:text="${successMessage}">
</div>

<div class="message error"
     th:if="${errorMessage != null}"
     th:text="${errorMessage}">
</div>

<div class="card">

    <table th:if="${not #lists.isEmpty(bills)}">
        <thead>
            <tr>
                <th>Bill ID</th>
                <th>Patient</th>
                <th>Description</th>
                <th>Bill Date</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="bill : ${bills}">
                <td th:text="${bill.id}"></td>
                <td th:text="${bill.patient != null ? bill.patient.name : 'N/A'}"></td>
                <td th:text="${bill.description != null ? bill.description : 'N/A'}"></td>
                <td th:text="${bill.billDate != null ? bill.billDate : 'N/A'}"></td>
                <td th:text="${'₹' + bill.amount}"></td>
                <td>
                    <span class="status"
                          th:text="${bill.status != null ? bill.status : 'Pending'}">
                    </span>
                </td>
                <td>
                    <form th:action="@{/admin/bills/delete/{id}(id=${bill.id})}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this bill?');">
                        <button type="submit" class="danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(bills)}">
        <h3>No bills found</h3>
        <p>Create a bill to see it listed here.</p>
    </div>

</div>

</main><footer>
    MediCare Medical Management System
</footer></body>
</html>
