<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments | Medical Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body><div class="container">
    <h1>Appointment Management</h1><div class="actions">
    <a th:href="@{/}" class="btn">Dashboard</a>
    <a th:href="@{/appointments/new}" class="btn">+ Book Appointment</a>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Patient Name</th>
            <th>Doctor</th>
            <th>Appointment Date</th>
            <th>Appointment Time</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="appointment : ${appointments}">
            <td th:text="${appointment.id}"></td>
            <td th:text="${appointment.patientName}"></td>
            <td th:text="${appointment.doctor != null ? appointment.doctor.name : 'Not assigned'}"></td>
            <td th:text="${appointment.appointmentDate}"></td>
            <td th:text="${appointment.appointmentTime}"></td>
            <td th:text="${appointment.reason}"></td>
            <td th:text="${appointment.status}"></td>
            <td>
                <a th:href="@{/appointments/delete/{id}(id=${appointment.id})}"
                   onclick="return confirm('Delete this appointment?')">
                    Delete
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(appointments)}">
            <td colspan="8">No appointments booked yet.</td>
        </tr>
    </tbody>
</table>

</div><script th:src="@{/js/app.js}"></script></body>
</html>
